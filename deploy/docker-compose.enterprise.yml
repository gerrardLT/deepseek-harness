# DeepSeek Harness + WorkFusion Enterprise Private Deployment
# Run with: docker compose -f deploy/docker-compose.enterprise.yml --env-file deploy/.env.enterprise up -d

services:
  # ── WorkFusion PostgreSQL ──
  workfusion-db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: workfusion
    volumes:
      - wf_pg_data:/var/lib/postgresql/data
    networks:
      - enterprise-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── WorkFusion Redis ──
  workfusion-redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - wf_redis_data:/data
    networks:
      - enterprise-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── WorkFusion API Backend ──
  workfusion-api:
    build:
      context: ../WorkFusion
      dockerfile: Dockerfile.backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@workfusion-db:5432/workfusion
      - CELERY_BROKER_URL=redis://workfusion-redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY required}
      - DELEGATION_JWT_SECRET=${DELEGATION_JWT_SECRET:-}
      - DSH_SERVICE_TOKEN=${DSH_SERVICE_TOKEN:?DSH_SERVICE_TOKEN required}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - FLASK_ENV=production
    volumes:
      - wf_app_data:/app/data
      - wf_app_logs:/app/logs
    depends_on:
      workfusion-db:
        condition: service_healthy
      workfusion-redis:
        condition: service_healthy
    networks:
      - enterprise-net
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── DeepSeek Harness Enterprise Web Runtime ──
  dsh-enterprise:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dsh
    restart: always
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY required}
      - BID_API_BASE_URL=http://workfusion-api:5000/api/agent
      - DSH_SERVICE_TOKEN=${DSH_SERVICE_TOKEN}
      - BID_DELEGATION_SUBJECT=${BID_DELEGATION_SUBJECT:-admin}
      - DSH_HOME=/data/dsh/home
      - DSH_AGENTS_HOME=/data/dsh/agents
      - BID_MAX_TENDER_BYTES=104857600
      - BID_MAX_EXPORT_BYTES=104857600
      - BID_TIMEOUT_MS=1800000
    volumes:
      - dsh_data:/data/dsh
    depends_on:
      workfusion-api:
        condition: service_healthy
    networks:
      - enterprise-net
    ports:
      - "3080:3080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  enterprise-net:
    driver: bridge

volumes:
  wf_pg_data:
  wf_redis_data:
  wf_app_data:
  wf_app_logs:
  dsh_data:
